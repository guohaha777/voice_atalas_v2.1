<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>万物声谱 功能审查表</title>
<style>
:root{
 color-scheme:light;
 --ink:#26301a;--muted:#7d8571;--text:#4f584a;--line:#ecefe2;--line-strong:#dde3cf;--field:#f3f7e2;--soft:#f6f8ef;--paper:#fff;
 --cream:#f7ffc5;--pink:#ffd4d9;--yellow:#ffe576;--lime:#c0e64f;--sky:#9fe8ff;--on-fill:#2f3b10;
 --green-text:#55720a;--alert:#d9566c;--alert-soft:#fff1f3;--sun-deep:#8a6a00;--sun-soft:#fff9da;--pass-soft:#f5fcdc;
 --bar-h:120px;
 font-family:"Heiti SC","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.55;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.hidden{display:none!important}

/* 顶部：标题 + 测试信息 + 导出 */
.top{max-width:1440px;margin:0 auto;padding:18px 20px 10px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.sub a{color:var(--green-text)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:99px;padding:6px 14px;background:var(--lime);color:var(--on-fill);font-weight:600;box-shadow:0 2px 0 #a5cf33;font-size:13px}
.btn.soft{background:var(--soft);color:var(--text);box-shadow:0 2px 0 var(--line-strong);font-weight:500}
.btn.warn{background:var(--alert-soft);color:var(--alert);box-shadow:0 2px 0 #f4c3cb;font-weight:500}
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer}
details.menu>summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--paper);border:1px solid var(--line-strong);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:190px;box-shadow:0 10px 30px #26301a1f}
.pop.meta{width:min(340px,86vw);gap:8px}
.pop label{font-size:12px;color:var(--muted);display:block}
.pop input{width:100%;padding:6px 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--soft)}

/* 进度条 */
.bar{position:sticky;top:0;z-index:10;background:#fffffff5;backdrop-filter:blur(6px);border-block:1px solid var(--line)}
.bar-in{max-width:1440px;margin:0 auto;padding:8px 20px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.progress{flex:1 1 320px}
.track{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--field)}
.track i{display:block;height:100%;transition:width .25s}
.t-pass{background:var(--lime)}.t-fail{background:var(--alert)}.t-block{background:var(--yellow)}
.counts{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px;font-size:12.5px;color:var(--text)}
.counts b{font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools input[type=search]{padding:5px 12px;border:1px solid var(--line-strong);border-radius:99px;background:var(--soft);width:150px}
.chip{border:0;border-radius:99px;padding:4px 12px;background:var(--soft);color:var(--text);box-shadow:0 2px 0 var(--line-strong);font-size:13px}
.chip[aria-pressed=true]{background:var(--lime);color:var(--on-fill);box-shadow:0 2px 0 #a5cf33;font-weight:600}
.sep{width:1px;height:20px;background:var(--line-strong);margin:0 2px}

/* 主体：左侧分组 + 右侧一组 */
.layout{max-width:1440px;margin:0 auto;padding:14px 20px 80px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:calc(var(--bar-h) + 12px);display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - var(--bar-h) - 24px);overflow:auto}
.side button{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:8px 12px;background:transparent;color:var(--text)}
.side button:hover{background:var(--soft)}
.side button[aria-current=true]{background:var(--cream);color:var(--on-fill);font-weight:700;box-shadow:inset 0 0 0 2px var(--lime)}
.side .nm{display:flex;justify-content:space-between;gap:8px}
.side .nm small{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.side .mini{display:block;height:4px;border-radius:9px;background:var(--field);margin-top:5px;overflow:hidden}
.side .mini i{display:block;height:100%;background:var(--lime)}

.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin:2px 0 10px}
.ghead h2{margin:0;font-size:19px}
.ghead .gc{font-size:13px;color:var(--green-text);font-weight:600}
.ghead p{flex-basis:100%;margin:0;color:var(--muted);font-size:13px}
.gblock+.gblock{margin-top:30px}

/* 表格行 */
.table{border:1px solid var(--line-strong);border-radius:16px;overflow:hidden}
.tr{display:grid;grid-template-columns:42px minmax(140px,.8fr) minmax(0,1.5fr) minmax(0,1.5fr) 156px minmax(160px,1fr);gap:0 14px;padding:10px 12px;border-bottom:1px solid var(--line);border-left:5px solid transparent;align-items:start}
.tr:last-child{border-bottom:0}
.tr.th{background:var(--field);color:var(--muted);font-size:12px;font-weight:600;padding-block:6px}
.tr:not(.th):nth-child(even){background:#fcfdf8}
.tr[data-s=pass]{background:var(--pass-soft);border-left-color:var(--lime)}
.tr[data-s=fail]{background:var(--alert-soft);border-left-color:var(--alert)}
.tr[data-s=block]{background:var(--sun-soft);border-left-color:var(--yellow)}
.iid{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.ititle{font-weight:700;font-size:14px;line-height:1.4}
.tag{display:inline-block;margin-top:4px;font-size:11.5px;padding:0 8px;border-radius:99px;line-height:1.6;color:var(--on-fill)}
.tag.w{background:var(--pink);margin-left:4px}
.tag.f{background:var(--cream);box-shadow:inset 0 0 0 1px var(--lime)}.tag.b{background:var(--sky)}
.api{display:block;margin-top:4px;font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;word-break:break-all;line-height:1.4}
.cell{font-size:13px;color:var(--text);line-height:1.6}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:0;border-radius:10px;padding:5px 0;background:var(--soft);color:var(--text);font-size:12.5px;box-shadow:0 2px 0 var(--line-strong)}
.seg button:hover{background:var(--field)}
.seg button[aria-pressed=true][data-v=pass]{background:var(--lime);color:var(--on-fill);box-shadow:0 2px 0 #a5cf33;font-weight:700}
.seg button[aria-pressed=true][data-v=fail]{background:var(--alert);color:#fff;box-shadow:0 2px 0 #b3405a;font-weight:700}
.seg button[aria-pressed=true][data-v=block]{background:var(--yellow);color:var(--sun-deep);box-shadow:0 2px 0 #e6c84a;font-weight:700}
.when{font-size:11px;color:var(--muted);margin-top:4px;min-height:1em}
textarea.note{width:100%;min-height:54px;padding:6px 9px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);resize:vertical;font-size:13px;line-height:1.5}
.lbl{display:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
.nextg{display:flex;justify-content:space-between;margin-top:16px}

@media (max-width:1100px){
 .tr{grid-template-columns:42px minmax(120px,.8fr) minmax(0,1.3fr) minmax(0,1.3fr) 150px}
 .tr>.nt{grid-column:3 / 6;margin-top:6px}
 .tr.th>.nt{display:none}
}
@media (max-width:820px){
 .layout{grid-template-columns:1fr;gap:10px;padding-inline:14px}
 .side{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}
 .side button{flex:none;width:auto;min-width:96px;background:var(--soft)}
 .bar{position:static}
 .tr.th{display:none}
 .tr{grid-template-columns:1fr;gap:6px;padding:12px}
 .tr>.nt{grid-column:auto;margin:0}
 .tr>.hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
 .lbl{display:inline;color:var(--muted);font-size:12px;margin-right:6px}
 .tools input[type=search]{flex:1 1 100%;width:auto}
 .top{padding-inline:14px}.bar-in{padding-inline:14px}
}
@media print{
 .bar,.side,.acts,.nextg{display:none!important}
 .layout{display:block}
 .tr{break-inside:avoid}
 .seg button:not([aria-pressed=true]){display:none}
}
</style>
</head>
<body>
<header class="top">
 <div>
  <h1>万物声谱 · 功能审查表</h1>
  <p class="sub">依据线上前端 <a href="https://voiceatalass.netlify.app/" target="_blank" rel="noopener">voiceatalass.netlify.app</a> 与预留的后端接口整理 · 结果自动保存在本浏览器</p>
 </div>
 <div class="acts">
  <details class="menu"><summary class="btn soft">测试信息</summary>
   <div class="pop meta">
    <div><label for="m-who">测试人</label><input id="m-who" data-meta="who" autocomplete="off"></div>
    <div><label for="m-date">测试日期</label><input id="m-date" data-meta="date" type="date"></div>
    <div><label for="m-env">测试环境 / 网址</label><input id="m-env" data-meta="env" placeholder="线上 / 本机 / 后端测试环境" autocomplete="off"></div>
    <div><label for="m-ver">前端版本 / 后端版本</label><input id="m-ver" data-meta="ver" placeholder="前端 421b067 · 后端 v0.4" autocomplete="off"></div>
    <div><label for="m-dev">测试设备 / 浏览器</label><input id="m-dev" data-meta="dev" placeholder="iPhone 15 Safari" autocomplete="off"></div>
   </div>
  </details>
  <button class="btn" id="csv">导出 Excel</button>
  <details class="menu"><summary class="btn soft">更多 ▾</summary>
   <div class="pop">
    <button class="btn soft" id="json">导出备份（JSON）</button>
    <label class="btn soft" style="cursor:pointer;text-align:center;color:var(--text)">导入备份<input type="file" id="imp" accept="application/json" hidden></label>
    <button class="btn soft" id="print">打印 / 存 PDF</button>
    <button class="btn warn" id="reset">全部重置</button>
   </div>
  </details>
 </div>
</header>

<div class="bar" id="bar">
 <div class="bar-in">
  <div class="progress">
   <div class="track" role="img" aria-label="测试进度"><i class="t-pass" id="bp"></i><i class="t-fail" id="bf"></i><i class="t-block" id="bb"></i></div>
   <div class="counts" id="counts" aria-live="polite"></div>
  </div>
  <div class="tools">
   <input type="search" id="q" placeholder="搜索全部功能 / 备注" aria-label="搜索">
   <button class="chip" data-filter="all" aria-pressed="true">全部</button>
   <button class="chip" data-filter="todo" aria-pressed="false">未测</button>
   <button class="chip" data-filter="fail" aria-pressed="false">不通过</button>
   <button class="chip" data-filter="block" aria-pressed="false">阻塞</button>
   <span class="sep"></span>
   <button class="chip" data-kind="f" aria-pressed="false" title="线上现在就能测的">只看前端</button>
   <button class="chip" data-kind="b" aria-pressed="false" title="接后端后才能测的">只看后端</button>
  </div>
 </div>
</div>

<div class="layout">
 <nav class="side" id="side" aria-label="分组"></nav>
 <main id="main"></main>
</div>

<script>
// 条目：[编号, 标题, 怎么测, 通过标准, 类型 f=前端 / b=后端, 预留接口或文件, 谁控制（语料 / 规则 / 提示词 / 模型 / 代码）]
const G=[
{id:'g',name:'全局与通用',desc:'每个页面都要看一遍；换设备、换浏览器各做一次。',items:[
 ['G1','路由直达与刷新','分别直接打开 /、/create、/world、/compose、/works，再刷新；随便输一个不存在的路径','每个地址都能打开，不出现 Netlify 404；未知路径回到首页','f'],
 ['G2','顶部步骤条','在声音诞生 / 声场 / 成曲页点 1 声音入口、2 声音诞生、3 万物声场、4 万物成曲','跳转正确；当前步骤高亮；本页步骤不当作链接','f'],
 ['G3','切页后声音停止','任意页面播放中（试听 / 整段 / 成曲播放），点步骤条或浏览器后退','上一页的声音立即停止，不串到下一页','f'],
 ['G4','同一时刻只有一个声音','连续点不同的试听按钮 / 小伙伴 / 播放','前一个自动停，不叠响','f'],
 ['G5','切后台暂停','播放中切到别的标签页再回来；手机锁屏再解锁','动画和音频按预期暂停，回来后状态正常，不卡死','f'],
 ['G6','控制台与网络','打开开发者工具，走完整流程','控制台无红色报错；接后端后，网络面板无 4xx / 5xx（除预期的未登录 / 未开放）','f'],
 ['G7','响应式','手机 375、平板 768、桌面各看一遍；重点宽度 700/701、900/901、360 以下','无横向滚动，文字不溢出，按钮不被遮挡，图片不变形','f'],
 ['G8','课堂大屏','在万物声场、万物成曲点顶栏「大屏」，再点「退出大屏」','全屏 / 大字 / 大按钮生效；退出后恢复；刷新后不卡在大屏','f'],
 ['G9','弹窗通用行为','打开任一弹窗：按 Esc、点背景、点右上关闭；Tab 键切换','都能关闭；焦点被限制在弹窗内；关闭后焦点回到原按钮；背景不跟着滚','f'],
 ['G10','错误兜底','制造一次错误（如断网后操作、后端返回异常）','出现友好提示或错误页，不白屏；可以回到首页继续','f'],
 ['G11','弱网','浏览器限速到 Slow 3G，进入声场并试听声音','出现“网络有点慢，声音没加载出来，再点一次试试”，再点一次能成功','f'],
 ['G12','浏览器兼容','iOS Safari、安卓 Chrome、微信内置浏览器、桌面 Chrome / Edge / Safari','核心流程可走通；不支持的能力（如录音）有明确提示','f'],
 ['G13','减少动态 / 省流量','系统开启“减少动态效果”；或浏览器开省流量','首页跳过自动开场；页面仍可正常使用；不预取下一页资源','f'],
 ['G14','来源与许可页','首页底部点「声音来源与许可」（/legal/sound-sources.html）','页面可打开，来源与许可信息完整','f'],
]},
{id:'h',name:'首页 /',desc:'声音入口。后端相关入口：登陆、API 输入。',items:[
 ['H1','首次进入与开场','清缓存后打开首页','约 1.5 秒草木开场；标题逐字入场；等待资源超过 1.8 秒则直接静态展示；不卡顿','f'],
 ['H2','重看开场','点右下「重看开场」','开场重新播放一遍','f'],
 ['H3','关闭 / 开启声音','点右下「关闭声音」，再点一次','关闭后点小伙伴无声；再开恢复；按钮文字随状态变化','f'],
 ['H4','小伙伴试听（6 个）','依次点小鸟、蝉、松鼠、青蛙、蜗牛、雨滴','每个都有声音和动作；一次只有一个在响；蜗牛是慢慢挪动','f'],
 ['H5','作品书架按钮','点顶栏「作品书架」','进入 /works','f'],
 ['H6','登陆按钮','点顶栏「登陆」','当前：弹出“未开放”提示，不出现假登录。接后端后：进入真实登录流程，访客仍可免登录体验示例','b','登录 /sign-in（暂无）'],
 ['H7','API 输入（弹窗）','点「API 输入」；分别填大语言模型 / 音乐模型的地址、模型名、Key；点显示密钥、应用、清空','校验提示正确（地址缺失、带密钥的地址、缺模型名）；Key 默认遮挡可切换；刷新后清空；当前不发起任何 API 调用','f'],
 ['H8','API 输入与后端的关系','接后端后检查：Key 是否仍只留在页面内存','Key 不写入 localStorage、不出现在请求地址里、不进日志；与服务端密钥配置的分工在备注里写清（密钥最终应只在服务端）','b','服务端环境变量'],
 ['H9','开始成曲','点「开始成曲」','直接进入 /create（声音诞生）','f'],
]},
{id:'b',name:'声音诞生 /create',desc:'录音、上传、声音库、纸卡、声卡信息、五项选择、对比试听。',items:[
 ['B1','顶栏入口','点「声音库」「作品书架」','声音库说明 / 弹窗正常；作品书架进入 /works','f'],
 ['B2','声音标记打招呼','点“声音标记，点一点和它打招呼”','精灵有动作和气泡台词；未选声音时提示“先给我一个声音吧！”','f'],
 ['B3','录音：打开弹窗','点「录音」','弹窗出现；浏览器弹出麦克风授权；显示“正在打开麦克风…”后可开始','f'],
 ['B4','录音：开始 / 停止 / 重录 / 使用','开始录音 → 停止 → 试听 → 重录 → 用这段声音','按钮状态随阶段变化；重录会覆盖草稿；“用这段声音”后声音进入当前声音条','f'],
 ['B5','录音：45 秒自动停止','开始录音后不停，等到 45 秒','到时自动停止并保留录音，不丢数据','f'],
 ['B6','录音：失败提示','分别：拒绝权限、无麦克风设备、http 地址、不支持的浏览器、录得过短','依次出现对应文案（没拿到权限 / 没找到麦克风 / 需要 https / 不支持 / 录得太短）','f'],
 ['B7','上传：正常文件','点「上传声音」，选 45 秒以内的音频','读取后进入当前声音条，可试听；显示“本机文件 · 未上传”','f'],
 ['B8','上传：超大 / 读不出 / 超长','选 >20MB 文件；非音频文件；>10 分钟的文件','分别提示“文件太大了”“读不出声音”“超过 10 分钟，请先剪短”','f'],
 ['B9','上传：超过 45 秒进入截取','上传 45 秒～10 分钟之间的音频','弹出“这段声音有点长”截取弹窗','f'],
 ['B10','截取弹窗','拖动绿框；调整开始 / 结束位置；点「试听这段」「停」；点「用这段声音」或「不用了」','最多选 45 秒；时间显示随拖动更新；试听的就是选中段；取消不产生声音','f'],
 ['B11','从声音库挑选','点「从声音库挑选」；试听示例；点「选用」','弹窗出现，分组正常；先试听再选用；“当前”标记正确；班级 / 公共提示“还未开放”','f'],

 ['N10','模型整体不可用','断开模型 / 返回 500 / 返回空内容','所有内容退回语料和本地背景；页面无报错、无空白、孩子照常使用','b','—','代码'],
 ['N11','稳定性：同一输入多次','同一个作品、同一任务连续跑 10 次','合格率记入备注；不合格的原因（字数 / 数字 / 格式）记下，据此改提示词','b','prompts/*.v1.json','提示词 + 模型'],
 ['N12','延迟与成本','记录各任务耗时、调用次数、费用','在预算内；耗时不影响孩子操作（都是后台，不阻塞播放）','b','—','模型'],
 ['N13','内容安全','让孩子输入不当词（心情、名字），或模型输出不当内容','服务端审核拦截；页面不显示不当内容，且有温和提示','b','server moderation','模型 + 代码'],

]},

 ['K1','登录与访客','登录后与未登录各走一遍完整流程','访客免登录能体验示例声卡与成曲；现场录音 / 保存 / 分享按需要登录；登录失效有提示','b','登录接口（待定）'],
 ['K2','权限由服务端执行','用另一个账号访问别人的作品 / 声音','返回无权限，前端展示不充当权限保障；可见范围（个人 / 班级 / 学校 / 地区 / 公开）按服务端过滤','b','server-side visibility'],
 ['K3','统一错误格式','制造 4xx / 5xx / 超时','返回 {status, reason, message, requestId}；前端转成儿童能懂的文案；requestId 能在服务端日志查到','b','错误格式'],
 ['K4','数据契约校验','让后端返回缺字段 / 类型错的数据','前端校验失败时不崩，提示重试；用的是 parseArrangement / parseSavedWork 等校验','b','packages/contracts'],
 ['K5','版本冲突','两个页面同时改同一作品','If-Match 过期返回 412，前端提示并让用户选择，不静默覆盖','b','If-Match / ETag'],
 ['K6','离线与重传','断网时上传 / 保存，恢复网络后','待上传内容保留；恢复后自动或手动重试成功；同一 sourceId 不重复','b','幂等上传'],

 ['K8','限频与额度','连续多次发起 AI 请求','超过每 IP / 设备额度时提示“quota”，不影响本地功能','b','quota'],
 ['K9','儿童隐私','抓包看所有请求','不含真实姓名、人脸、精确地点；模型请求只带匿名摘要；原始录音不被覆盖','b','—'],
 ['K10','乐器库（服务端）','接后端后','乐器列表来自服务端，经授权审核；“更多乐器”按开放情况出现','b','GET /api/v1/instruments'],
 ['K11','课本歌曲目录（服务端）','接后端后','按教材版本 / 年级拉取；特征卡通过校验；离线时回到随页面提供的卡片','b','GET /api/v1/textbook-tracks'],
 ['K12','教学音乐上传链路','接后端后：老师上传教学音乐','需老师登录并确认授权；30MiB / 10 分钟内；直传存储可续传；分析中→完成；分析后删除音频只留特征；背景请求带 musicId','b','POST /api/v1/teaching-music …'],
 ['K13','性能','弱网 / 低端手机，看首屏与切页','首页首屏快；各页按需分包；预取不阻塞操作','f'],
]},
];
const STATUS={pass:'通过',fail:'不通过',block:'阻塞'};
const KEY='wanwu-feature-review-v1';
let state={meta:{},items:{}};
const lsGet=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch{return null;}};
const lsSet=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}};
state=Object.assign(state,lsGet()||{});state.meta=state.meta||{};state.items=state.items||{};

const flat=G.flatMap(g=>g.items.map(([id,title,how,ok,kind,api,who])=>({gid:g.id,gname:g.name,id,title,how,ok,kind,api,who})));
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let filter='all',kind='',q='';
let view=G.some(g=>g.id===state.view)||state.view==='all'?state.view:G[0].id;

const sOf=id=>(state.items[id]||{}).s||'';
function match(x){
 const it=state.items[x.id]||{};
 if(filter==='todo'&&it.s)return false;
 if(filter==='fail'&&it.s!=='fail')return false;
 if(filter==='block'&&it.s!=='block')return false;
 if(kind&&x.kind!==kind)return false;
 if(q&&!(x.id+x.title+x.how+x.ok+(x.api||'')+(x.who||'')+(it.note||'')).toLowerCase().includes(q))return false;
 return true;
}
const rowHtml=x=>`<div class="tr" data-id="${x.id}" data-s="${sOf(x.id)}">
 <div class="iid">${x.id}</div>
 <div class="hd"><div class="ititle">${esc(x.title)}</div><span class="tag ${x.kind}">${x.kind==='f'?'前端':'后端'}</span>${x.who?`<span class="tag w">${esc(x.who)}</span>`:''}${x.api?`<span class="api">${esc(x.api)}</span>`:''}</div>
 <div class="cell"><span class="lbl">怎么测</span>${esc(x.how)}</div>
 <div class="cell"><span class="lbl">通过标准</span>${esc(x.ok)}</div>
 <div><div class="seg" role="group" aria-label="${x.id} 测试结果">
  <button type="button" data-v="pass" aria-pressed="${sOf(x.id)==='pass'}">通过</button>
  <button type="button" data-v="fail" aria-pressed="${sOf(x.id)==='fail'}">不通过</button>
  <button type="button" data-v="block" aria-pressed="${sOf(x.id)==='block'}">阻塞</button>
 </div><div class="when">${whenText(x.id)}</div></div>
 <div class="nt"><textarea class="note" placeholder="备注：现象、接口返回、负责人…" aria-label="${x.id} 备注">${esc((state.items[x.id]||{}).note||'')}</textarea></div>
</div>`;
function whenText(id){const it=state.items[id]||{};return it.at?`${STATUS[it.s]||'已备注'} · ${it.at}`:'';}

function renderSide(){
 const all=`<button type="button" data-view="all" ${view==='all'?'aria-current="true"':''}><span class="nm"><span>全部（长列表）</span><small>${flat.length}</small></span></button>`;
 $('#side').innerHTML=G.map(g=>`<button type="button" data-view="${g.id}" ${view===g.id?'aria-current="true"':''}><span class="nm"><span>${esc(g.name)}</span><small data-sg="${g.id}"></small></span><span class="mini"><i data-sb="${g.id}"></i></span></button>`).join('')+all;
}
function renderMain(){
 const showAll=view==='all'||q||filter!=='all'||kind;
 const groups=showAll?G:[G.find(g=>g.id===view)];
 const blocks=groups.map(g=>{
  const items=flat.filter(x=>x.gid===g.id&&match(x));
  if(!items.length)return '';
  const gi=G.indexOf(g),nxt=G[gi+1],prv=G[gi-1];
  return `<section class="gblock" id="grp-${g.id}">
   <div class="ghead"><h2>${esc(g.name)}</h2><span class="gc" data-gc="${g.id}"></span><p>${esc(g.desc)}</p></div>
   <div class="table"><div class="tr th"><div>编号</div><div>功能</div><div>怎么测</div><div>通过标准</div><div>结果</div><div class="nt">备注</div></div>${items.map(rowHtml).join('')}</div>
   ${showAll?'':`<div class="nextg">${prv?`<button class="btn soft" data-view="${prv.id}">← ${esc(prv.name)}</button>`:'<span></span>'}${nxt?`<button class="btn" data-view="${nxt.id}">下一组：${esc(nxt.name)} →</button>`:''}</div>`}
  </section>`;
 }).join('');
 $('#main').innerHTML=blocks||'<p class="empty">这一组里没有符合条件的条目。换个筛选，或切到别的分组看看。</p>';
 stats();
}
function render(){renderSide();renderMain();}

function stats(){
 const n=flat.length;let p=0,f=0,b=0;
 for(const x of flat){const s=sOf(x.id);if(s==='pass')p++;else if(s==='fail')f++;else if(s==='block')b++;}
 const todo=n-p-f-b;
 $('#bp').style.width=p/n*100+'%';$('#bf').style.width=f/n*100+'%';$('#bb').style.width=b/n*100+'%';
 $('#counts').innerHTML=`<span><i class="dot t-pass"></i>通过 <b>${p}</b></span><span><i class="dot t-fail"></i>不通过 <b>${f}</b></span><span><i class="dot t-block"></i>阻塞 <b>${b}</b></span><span><i class="dot" style="background:var(--line-strong)"></i>未测 <b>${todo}</b></span><span style="color:var(--muted)">共 ${n} 条 · 已测 ${Math.round((n-todo)/n*100)}%</span>`;
 for(const g of G){
  const items=g.items,tot=items.length;
  let gp=0,gd=0;for(const [id] of items){const s=sOf(id);if(s==='pass')gp++;if(s)gd++;}
  const sg=$(`[data-sg="${g.id}"]`),sb=$(`[data-sb="${g.id}"]`),gc=$(`[data-gc="${g.id}"]`);
  if(sg)sg.textContent=`${gd}/${tot}`;
  if(sb)sb.style.width=gd/tot*100+'%';
  if(gc)gc.textContent=`已测 ${gd} / ${tot} · 通过 ${gp}`;
 }
}
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;};

document.addEventListener('click',e=>{
 const b=e.target.closest('.seg button');
 if(b){
  const el=b.closest('.tr'),id=el.dataset.id,it=state.items[id]=state.items[id]||{};
  it.s=it.s===b.dataset.v?'':b.dataset.v;it.at=stamp();
  el.dataset.s=it.s;
  for(const x of el.querySelectorAll('.seg button'))x.setAttribute('aria-pressed',String(x.dataset.v===it.s));
  el.querySelector('.when').textContent=whenText(id);
  lsSet();stats();return;
 }
 const v=e.target.closest('[data-view]');
 if(v){view=v.dataset.view;state.view=view;lsSet();render();scrollTo({top:0});return;}
 const c=e.target.closest('.chip');
 if(c){
  if(c.dataset.filter){filter=c.dataset.filter;for(const x of document.querySelectorAll('[data-filter]'))x.setAttribute('aria-pressed',String(x===c));}
  else{kind=kind===c.dataset.kind?'':c.dataset.kind;for(const x of document.querySelectorAll('[data-kind]'))x.setAttribute('aria-pressed',String(x.dataset.kind===kind));}
  // 筛选“未测 / 不通过 / 阻塞”时跨分组显示，方便一次看完
  renderMain();
 }
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.classList.contains('note')){
  const el=t.closest('.tr'),id=el.dataset.id,it=state.items[id]=state.items[id]||{};
  it.note=t.value;it.at=stamp();el.querySelector('.when').textContent=whenText(id);lsSet();return;
 }
 if(t.dataset.meta){state.meta[t.dataset.meta]=t.value;lsSet();return;}
 if(t.id==='q'){q=t.value.trim().toLowerCase();renderMain();}
});
// 点菜单外面关闭菜单
document.addEventListener('click',e=>{for(const d of document.querySelectorAll('details.menu[open]'))if(!d.contains(e.target))d.open=false;});
// 进度条高度（给左侧导航做吸顶偏移）
const setBar=()=>document.documentElement.style.setProperty('--bar-h',$('#bar').offsetHeight+'px');
new ResizeObserver(setBar).observe($('#bar'));

const download=(name,type,text)=>{
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
const day=()=>stamp().slice(0,10);
$('#csv').onclick=()=>{
 const q2=s=>`"${String(s??'').replace(/"/g,'""')}"`;
 const rows=[['编号','分组','功能','类型','控制方','怎么测','通过标准','接口 / 文件','结果','备注','更新时间']];
 for(const x of flat){const it=state.items[x.id]||{};rows.push([x.id,x.gname,x.title,x.kind==='f'?'前端':'后端',x.who||'',x.how,x.ok,x.api||'',STATUS[it.s]||'未测',it.note||'',it.at||'']);}
 const m=state.meta,head=[['测试人',m.who||''],['日期',m.date||''],['环境',m.env||''],['版本',m.ver||''],['设备',m.dev||''],[]];
 download(`万物声谱功能审查表_${day()}.csv`,'text/csv;charset=utf-8','﻿'+[...head,...rows].map(r=>r.map(q2).join(',')).join('\r\n'));
};
$('#json').onclick=()=>download(`万物声谱功能审查表备份_${day()}.json`,'application/json',JSON.stringify(state,null,1));
$('#imp').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const d=JSON.parse(await f.text());if(typeof d!=='object'||!d||typeof d.items!=='object')throw 0;
  if(!confirm('导入会覆盖当前页面里已填的内容，确定吗？'))return;
  state={meta:d.meta||{},items:d.items||{},view};lsSet();for(const el of document.querySelectorAll('[data-meta]'))el.value=state.meta[el.dataset.meta]||'';render();
 }catch{alert('这个文件读不出来，请选之前导出的 JSON 备份。');}
 e.target.value='';
};
$('#print').onclick=()=>{const keep=view;view='all';renderMain();print();view=keep;renderMain();};
$('#reset').onclick=()=>{
 if(!confirm('会清空所有结果和备注，确定重置吗？（建议先导出备份）'))return;
 state={meta:state.meta,items:{},view};lsSet();render();
};
for(const el of document.querySelectorAll('[data-meta]'))el.value=state.meta[el.dataset.meta]||'';
render();setBar();
</script>
</body>
</html>
