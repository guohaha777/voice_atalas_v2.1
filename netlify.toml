[build]
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24.21.0"

[[redirects]]
  from = "/api/v1/*"
  to = "https://wanwu-api.proterm.ink/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "microphone=(self), camera=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
